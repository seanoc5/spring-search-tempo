app:
  onedrive:
    # 32-byte AES key (Base64) — deterministic for tests only; rotate in prod.
    token-encryption-key: "MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY="
  mirror:
    # Disabled by default in tests so MirrorJobIT and friends don't
    # incidentally launch the destination-account email quick-sync. The
    # dedicated MirrorAutoIndexIT enables this with @TestPropertySource.
    auto-index: false
    # Disable the per-MirrorConfig cron scheduler (issue #38) by default in
    # tests so unrelated ITs don't see surprise mirror dispatches. Tests
    # that exercise scheduling should enable it via @TestPropertySource.
    scheduler:
      enabled: false

spring:
  sql:
    init:
      mode: always  # Run schema.sql to enable pgvector extension
  flyway:
    # Tests use ddl-auto: create-drop to manage schema. Flyway running in
    # parallel would leave a stale schema_history pointing at dropped tables.
    # Hibernate, driven by the JPA entities, is the source of truth for the
    # test schema; Flyway is for the dev/prod path.
    enabled: false
  jpa:
    hibernate:
      # Use `update` (not `create-drop`) so that Hibernate never drops a
      # table on context shutdown (issue #46). The Testcontainers PostgreSQL
      # container is `withReuse(true)` and is shared by every cached Spring
      # test context in the suite. With `create-drop`, one context shutting
      # down would drop the tables out from under any sibling cached
      # context still bound to the same database — manifesting as random
      # `relation "..." does not exist` failures whose pattern depends on
      # the order JUnit happens to execute classes. `update` keeps every
      # entity-mapped table present for the lifetime of the container; the
      # `@Sql` cleanup script in `BaseIT` resets row state between tests.
      ddl-auto: update
    show-sql: false
  batch:
    job:
      enabled: false  # Disable batch jobs during tests unless explicitly needed
    jdbc:
      initialize-schema: always  # Create batch tables for tests
  session:
    jdbc:
      initialize-schema: always  # Create session tables for tests
