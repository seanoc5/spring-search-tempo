<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="result" id="validation-result">
    <div th:if="${validationResult}"
         th:class="'alert alert-' + ${validationResult.severity}"
         role="alert">
        <h6 class="alert-heading mb-1">
            <i class="bi bi-shield-check me-1" th:if="${validationResult.severity == 'success'}"></i>
            <i class="bi bi-shield-exclamation me-1" th:unless="${validationResult.severity == 'success'}"></i>
            <span th:text="${validationResult.heading}">Heading</span>
        </h6>
        <p class="mb-1 small" th:text="${validationResult.message}">Detail message</p>
        <div th:if="${validationResult.capabilities != null && !validationResult.capabilities.isEmpty()}"
             class="small mt-2">
            <strong>Capabilities:</strong>
            <span th:each="cap, iter : ${validationResult.capabilities}">
                <code th:text="${cap}"></code><span th:unless="${iter.last}">, </span>
            </span>
        </div>
        <div class="small text-muted mt-1">
            Outcome: <code th:text="${validationResult.outcome}"></code>
        </div>
    </div>
</div>
</body>
</html>
