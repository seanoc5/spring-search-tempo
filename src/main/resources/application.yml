server:
  port: 8082
  servlet:
    session:
      cookie:
        # Use a non-default cookie name to avoid collisions with other local apps.
        # Including port prevents cross-port localhost overwrites.
        name: ${SESSION_COOKIE_NAME:tempo-session-${server.port}}
  tomcat:
    max-swallow-size: 100MB

spring:
  devtools:
    restart:
      enabled: false  # Reliability-first: avoid restart-induced auth/session churn
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false  # Disable auto-run - jobs are triggered via UI/API
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/tempo}
    username: ${JDBC_DATABASE_USERNAME:tempo}
    password: ${JDBC_DATABASE_PASSWORD:password}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 12
  flyway:
    # Coexists with ddl-auto during rapid development (see ADR-004).
    # baseline-on-migrate lets Flyway adopt existing databases that were
    # built with ddl-auto without failing on a missing schema_history.
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    # Allow lower-numbered migrations to apply after higher-numbered ones.
    # Required for the swarm workflow: parallel feature branches each claim
    # the next free V-number, and PRs can land in any order.
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        id:
          new_generator_mappings: true
  messages:
    basename: messages,messagesWeb
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: mxbai-embed-large
          truncate: true
  docker:
    compose:
      lifecycle-management: start-only
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never  # Tables created via docs/sql/013-add-session-remember-me.sql
      table-name: SPRING_SESSION
    timeout: 30d  # Long-lived dev session window
  # just in case, increase to '100MB'
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      FSFileUriUnique: FSFILE_URI_UNIQUE
      FSFolderUriUnique: FSFOLDER_URI_UNIQUE
      AnnotationLabelUnique: ANNOTATION_LABEL_UNIQUE
      SpringUserLabelUnique: SPRING_USER_LABEL_UNIQUE
      SpringRoleLabelUnique: SPRING_ROLE_LABEL_UNIQUE

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:spring-search-tempo}
      host: ${app.host-name:localhost}
    distribution:
      percentiles-histogram:
        tempo.batch.jobrun.duration: true

app:
  host-name: "${TEMPO_HOST_NAME:localhost}"
  jobs:
    heartbeat:
      # Defense-in-depth backstop for in-process wedged steps (issue #64).
      # JobExecutionAdvisoryLockListener handles JVM-death detection with
      # hard evidence (PostgreSQL session-scoped advisory locks), so this
      # threshold can be conservative: only a *live* JVM with a hung step
      # (e.g., wedged IMAP socket inside a CompletableFuture) needs to be
      # caught by the soft heartbeat path. 60 min comfortably exceeds any
      # legitimately-slow chunk (Tika on a big PDF, 50 MB IMAP FETCH).
      stale-threshold-minutes: 60
  monitoring:
    grafana-batch-dashboard-url: "${GRAFANA_BATCH_DASHBOARD_URL:http://localhost:3000/d/tempo-batch-overview}"
  security:
    remember-me-key: "${REMEMBER_ME_KEY:spring-search-tempo-remember-me-key}"
    # Separate cookie name avoids collisions with other localhost apps/ports.
    remember-me-cookie-name: "${REMEMBER_ME_COOKIE_NAME:tempo-remember-me-${server.port}}"
    # Reliability-first defaults (especially for local development use).
    remember-me-validity-days: ${REMEMBER_ME_VALIDITY_DAYS:365}
    remember-me-always: ${REMEMBER_ME_ALWAYS:true}
    # true = DB-backed persistent tokens, false = stateless signed cookie.
    remember-me-persistent: ${REMEMBER_ME_PERSISTENT:true}
    # AES-256-GCM key (base64, 32 bytes) used for at-rest encryption of OAuth2 refresh
    # tokens AND IMAP passwords. Single shared key — formerly named app.onedrive.token-encryption-key
    # / ONEDRIVE_TOKEN_ENCRYPTION_KEY; the old name still works but logs a deprecation warning.
    encryption-key: "${APP_ENCRYPTION_KEY:}"
  crawl:
    # App-wide absolute ceiling on directory-walk depth (issue #105).
    # Per-crawl `max-depth` continues to win when smaller; this is a
    # cross-cutting backstop respected by FilesystemFolderAuditJob,
    # DiscoveryReader, and CombinedCrawlReader. 50 comfortably exceeds
    # any sane filesystem depth.
    absolute-max-depth: 50
    # How filesystem stat metadata is gathered during a crawl (issue #148):
    #   SEQUENTIAL  one stat per file on the calling thread (default; lowest overhead on SSD)
    #   PARALLEL    bounded ForkJoinPool fan-out (parallelism = min(cpus, 8))
    #   BULK        reserved for future OS-batched syscall path; currently falls back to PARALLEL
    # Flip to PARALLEL on spinning disks / network mounts where stat latency dominates.
    # Timing is exposed at `tempo.crawl.metadata.read` (tag mode=…).
    metadata-gather-mode: SEQUENTIAL
    # After chunking, `fs_file.body_text` is truncated to this many CHARACTERS
    # (ADR-006 / issue #147). Char-count is what PostgreSQL `LENGTH(text)`
    # reports; UTF-8 means on-disk bytes can be 2–4× larger for non-ASCII.
    # Full document remains addressable via ContentChunk rows. Default
    # 1,048,576. Set <= 0 to disable truncation.
    large-body-threshold-chars: 1048576
    # Global defaults that all crawls inherit
    defaults:
      max-depth: 10
      follow-links: false
      parallel: false
      # Hours threshold for "recent crawl" skip logic.
      # If a folder was crawled by another config within this many hours,
      # the current crawl can skip that subtree (only at crawl config root dirs).
      recent-crawl-skip-hours: 24
      folder-patterns:
        # SKIP: Persist folder metadata but don't crawl children (processing stops here)
        skip:
          # --- Version control & IDE ---
          - ".*/\\.git/.*"
          - ".*/\\.svn/.*"
          - ".*/\\.hg/.*"
          - ".*/\\.idea/.*"
          - ".*/\\.vscode/.*"
          # --- Build outputs ---
          - ".*/\\.gradle/.*"
          - ".*/build/.*"
          - ".*/out/.*"
          - ".*/target/.*"
          - ".*/dist/.*"
          # --- Package managers / dependencies ---
          - ".*/node_modules/.*"
          - ".*/vendor/.*"
          - ".*/packages/.*"
          - ".*/\\.npm/.*"
          - ".*/\\.yarn/.*"
          - ".*/\\.pnpm-store/.*"
          - ".*/bower_components/.*"
          # --- Python environments & caches ---
          - ".*/\\.venv/.*"
          - ".*/venv/.*"
          - ".*/__pycache__/.*"
          - ".*/\\.mypy_cache/.*"
          - ".*/\\.pytest_cache/.*"
          - ".*/\\.tox/.*"
          - ".*/.eggs/.*"
          - ".*/\\.egg-info/.*"
          - ".*/site-packages/.*"
          # --- Conda / Miniforge / Mamba ---
          - ".*/miniforge3/.*"
          - ".*/miniconda3/.*"
          - ".*/anaconda3/.*"
          - ".*/mambaforge/.*"
          - ".*/\\.conda/.*"
          # --- Java / Kotlin ---
          - ".*/\\.m2/.*"
          - ".*/\\.ivy2/.*"
          # --- Rust / Go ---
          - ".*/\\.cargo/.*"
          - ".*/\\.rustup/.*"
          - ".*/.cache/go-build/.*"
          # --- OS / system ---
          - "/tmp/.*"
          - "/run/.*"
          - "/root/.*"
          - "/proc/.*"
          - "/sys/.*"
          - "/dev/.*"
          - "/snap/.*"
          - "/lost\\+found/.*"
          # --- User caches & trash ---
          - ".*/\\.cache/.*"
          - ".*/\\.local/share/Trash/.*"
      file-patterns:
        # SKIP: Persist file metadata only (no text extraction)
        skip:
          - ".*\\.(lck|tmp|~|bak|bk1|bk2)$"
          - ".*/(deleteme.*|ignoreme.*)"

    # Crawl configurations are now managed in the database.
    # Seed data: docs/sql/012-seed-crawl-configs.sql
    # Edit via UI: /crawlConfigs/{id}/edit

  # Per-entry archive enumeration (issue #118).
  # When enabled, .zip/.tar/.tar.gz/.7z/.jar files seen during a crawl produce one
  # FSFile row per inner entry with a synthetic jar-style URI
  # (file:///path/archive.zip!/inner/file.txt). Each entry runs through the same
  # PatternMatchingService as a regular file, so .git/ inside a zip is still SKIP.
  archive:
    enabled: true
    # Outer archive = depth 1. An archive-inside-an-archive-inside-an-archive
    # triggers a SKIP-with-reason at depth 3.
    max-recursion-depth: 2
    # Archives with more entries than this fall back to LOCATE-only treatment
    # to keep DB growth bounded. Log line names the archive and entry count.
    max-extracted-entries: 1000

  scheduling:
    crawl:
      enabled: false
      cron: "0 0 1 * * *" # Every day at 01:00
      zone: "America/New_York" # EDT/EST with DST handling
      run-missed-on-startup: true
      startup-grace-minutes: 5
    email:
      enabled: false
      cron: "0 0 */4 * * *" # Every 4 hours
      zone: "America/New_York"
      run-missed-on-startup: true
      startup-grace-minutes: 5
      trigger-after-crawl: false  # Chain email sync after file crawl
      # MultiAccountEmailScheduler: how often to wake and check which accounts
      # are due per their per-row cronSchedule. Default 5 min matches Apple
      # Mail's idle-fallback cadence; Thunderbird default is 10 min. The cron
      # boundary in each account row is the *actual* dispatch gate — this tick
      # only adds wake-up latency. Index freshness for search doesn't need
      # real-time, so 60s ticking was wasteful (~1440 wakes/day to dispatch
      # maybe once for a daily-cron account).
      multi-account:
        tick-millis: 300000

  # Email crawling configuration
  email:
    enabled: true  # Enable when ready to crawl email
    quick-sync-folders:
      - "INBOX"
      - "Sent"
    # Attachments are streamed through Tika during body enrichment and
    # persisted as ContentChunk rows (chunkType=EmailAttachment).
    # Set max-attachment-size to 0 or attachment-extraction.enabled=false
    # to skip entirely.
    max-attachment-size: 26214400  # 25 MB
    attachment-extraction:
      enabled: true
    # IMAP mirror job (issue #24, ADR-005). Per-config rate limiting and
    # folder mappings live on the MirrorConfig entity itself.
    mirror:
      # Spring Batch chunk size for the mirrorStep. Smaller chunks tighten
      # the checkpoint cadence; larger chunks reduce DB write overhead.
      chunk-size: 25
    # Credentials are stored DB-encrypted (issue #55). The `accounts:` block below carries
    # default host/port/region info only — set the IMAP password by editing the account in
    # the UI (/emailAccounts/{id}/edit → IMAP Password).
    accounts:
      # Gmail account (requires App Password)
      # To enable:
      # 1. Go to https://myaccount.google.com/apppasswords
      # 2. Generate an app password for "Mail"
      # 3. Export GMAIL_EMAIL=<your-gmail-address>
      # 4. Start the app, open this account in the UI, and paste the password into the
      #    "IMAP / App password" field on the edit page.
      - name: "personal-gmail"
        email: "${GMAIL_EMAIL:sean.oconnor@stvfd.org}"
        provider: "GMAIL"
        enabled: true

      # Amazon WorkMail account
      # To enable:
      # 1. Get your WorkMail username (usually email address)
      # 2. Export WORKMAIL_EMAIL=<your-workmail-email>
      # 3. Start the app, open this account in the UI, and paste the WorkMail password
      #    into the "IMAP / App password" field on the edit page.
      - name: "work-email"
        email: "${WORKMAIL_EMAIL:sean@oconeco.com}"
        provider: "WORKMAIL"
        imap-host: "imap.mail.us-east-1.awsapps.com"
        imap-port: 993
        region: "us-east-1"
        enabled: true

  # IMAP mirror autotrigger (issue #35). When true, a completed mirror run
  # publishes MirrorJobCompletedEvent and MirrorIndexingTriggerListener
  # launches an email quick-sync (headers→body→chunks→NLP→categorization→
  # embedding) against the destination account so the mirrored messages
  # become searchable without manual intervention. Set false to suppress
  # the autotrigger; manual MirrorJobLauncher.launch is unaffected.
  mirror:
    auto-index: true
    # Per-MirrorConfig cron scheduler (issue #38). Iterates enabled
    # MirrorConfig rows that have a cronSchedule set and dispatches due
    # mirrors via MirrorJobLauncher. Manual launches still work
    # independently. Set enabled=false to suppress the scheduler tick
    # (e.g. tests that don't exercise scheduling).
    scheduler:
      enabled: true
      tick-millis: 60000

  # Browser history sync (Firefox places.sqlite -> BrowserBookmark[sourceType=HISTORY])
  browser:
    history:
      enabled: true
      # Ignore visits older than this many days. Set to null/empty to keep all.
      retention-days: 365
      # Chain a history sync after each successful bookmark import.
      auto-trigger: true

  embedding:
    enabled: true
    model-name: mxbai-embed-large
    max-text-length: 8192
    batch-size: 10

  # Folder audit (issue #103): "sanity-check" enumeration that walks every
  # directory under start paths *including under SKIP folders*, so the
  # operator can reconcile our folder count against `find / -type d` and
  # surface "hidden gem" folders that should probably be reclassified.
  audit:
    # How many levels to descend below a detected SKIP root before the
    # visitor returns SKIP_SUBTREE. Default 1 — we'll record the SKIP
    # root itself and its immediate children, but not grandchildren.
    # This is the cost-control knob that prevents
    # node_modules/foo/node_modules/bar/... from exploding.
    hidden-gem-peek-depth: 1
    # Weekly @Scheduled trigger for FolderAuditScheduler (issue #105).
    # Default 03:00 every Sunday. Set weekly-enabled=false to kill the
    # cron without changing the expression (the REST endpoint and admin
    # button keep working).
    weekly-cron: "0 0 3 * * SUN"
    weekly-enabled: true
    # Snapshot rotation: keep the latest N folder_audit_run + folder_snapshot
    # rows; prune older ones after a successful audit run.
    # `hidden_gem_resolution` rows are NOT rotated — they're durable.
    retain-runs: 4

  # OneDrive integration (OAuth2 + PKCE, Microsoft Graph API)
  onedrive:
    enabled: false
    client-id: "${ONEDRIVE_CLIENT_ID:}"
    redirect-uri: "http://localhost:8089/oneDriveAccounts/callback"
    scopes:
      - "Files.Read"
      - "offline_access"
      - "User.Read"
    # DEPRECATED: rename to app.security.encryption-key (env APP_ENCRYPTION_KEY).
    # Still honored as a fallback so existing deployments keep working; remove once migrated.
    token-encryption-key: "${ONEDRIVE_TOKEN_ENCRYPTION_KEY:}"
    download-temp-dir: "/tmp/onedrive-downloads"
    max-download-size-mb: 100

      # Generic IMAP server example
      # - name: "custom-imap"
      #   email: "${CUSTOM_EMAIL:}"
      #   provider: "GENERIC_IMAP"
      #   imap-host: "imap.example.com"
      #   imap-port: 993
      #   enabled: false
      # (password is set via /emailAccounts/{id}/edit in the UI, not in YAML)
