# Prometheus runs on HOST networking (since 2026-09-20): the app binds its management
# port to 127.0.0.1 per the cross-machine port map (sysadmin/docs/port-map.md), which a
# bridge-network scraper cannot reach. One Prometheus on :9090 per host follows, so this
# stack cannot run alongside the host's shared monitoring stack
# (sysadmin/services/monitoring), which already scrapes this app on minti9 -- use this
# on a box that has no shared stack.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: tempo-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=14d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tempo-grafana
    depends_on:
      - prometheus
    extra_hosts:
      # Prometheus is on the host network; Grafana (bridge) reaches it via the gateway.
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
