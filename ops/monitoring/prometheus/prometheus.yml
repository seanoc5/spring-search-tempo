global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: spring-search-tempo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9085   # host networking; 127.0.0.1 not localhost (app binds IPv4 loopback only)
    basic_auth:
      username: admin
      password: admin
